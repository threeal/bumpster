[package]
name = "bumpster"
version = "0.1.0"
authors = ["Alfi Maulana <alfi.maulana.f@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["bump", "dependencies", "pull-request", "version"]
license = "MIT"
repository = "https://github.com/threeal/bumpster"
rust-version = "1.99"
description = "Bump tool versions that Dependabot can't, in PRs authored by you"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
serde_json = "1.0.154"
ureq = "3.5.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[lints.rust]
warnings = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
